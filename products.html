<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7EDE7;color:#1A1A1A;font-family:'DM Sans',sans-serif}
header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7dcd5}
.logo{font-family:'Playfair Display',serif;font-size:30px;letter-spacing:4px}
header a{color:#1A1A1A;text-decoration:none;font-size:12px;letter-spacing:1px}
.intro{text-align:center;padding:65px 20px 35px}
.intro span{color:#C97B7B;font-size:11px;letter-spacing:4px;text-transform:uppercase}
.intro h1{font-family:'Playfair Display',serif;font-size:clamp(36px,6vw,55px);font-weight:500;margin:12px 0}
.intro p{color:#777;font-size:13px}
.toolbar{max-width:1200px;margin:25px auto 35px;padding:0 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.toolbar select{padding:12px 15px;border:1px solid #d9cbc2;background:transparent;font-family:inherit;cursor:pointer}
.products{max-width:1200px;margin:auto;padding:0 25px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.product-card{background:#fffaf7;overflow:hidden;cursor:pointer}
.product-image{height:350px;background:#eee2dc;overflow:hidden;display:flex;align-items:center;justify-content:center}
.product-image img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.product-card:hover img{transform:scale(1.04)}
.product-info{padding:18px}
.product-info h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;margin-bottom:8px}
.product-info p{color:#777;font-size:12px;margin-bottom:12px}
.price{font-weight:700;font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:#777}
.image-error{color:#9b7770;font-size:13px;text-align:center;padding:15px}
footer{background:#1A1A1A;color:#c9bdb5;text-align:center;padding:30px 15px;font-size:11px;letter-spacing:2px}

@media(max-width:800px){
.products{grid-template-columns:repeat(2,1fr)}
.product-image{height:300px}
}
@media(max-width:520px){
header{padding:18px}
.logo{font-size:24px}
.products{grid-template-columns:1fr}
.product-image{height:380px}
.toolbar{flex-wrap:wrap}
}
</style>

                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p>${categoryNames[category]} / ${typeNames[type]}</p>
                    <div class="price">${product.price.toLocaleString("en-US")} EGP</div>
                </div>

            </article>
        `).join("");

        grid.querySelectorAll(".product-card").forEach(card => {
            card.addEventListener("click", function() {
                const productIndex = Number(this.dataset.productIndex);
                openProduct(products[productIndex]);
            });
        });
    }

    /* SORT PRODUCTS */
    sortSelect.addEventListener("change", function() {
        let sorted = [...products];

        if (this.value === "low") {
            sorted.sort((a,b) => a.price - b.price);
        }

        if (this.value === "high") {
            sorted.sort((a,b) => b.price - a.price);
        }

        displayProducts(sorted);
    });

    displayProducts(products);
}
</script>

</body>
</html>
