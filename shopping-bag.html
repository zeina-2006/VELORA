<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | VELORA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F7EDE7;
            color: #1A1A1A;
        }

        header {
            background: #1A1A1A;
            color: white;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .bag-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .bag-item {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .bag-item img {
            width: 120px;
            height: 140px;
            object-fit: cover;
            background: #eee;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 10px;
        }

        .item-info p {
            margin: 7px 0;
            color: #666;
            font-size: 14px;
        }

        .item-price {
            font-weight: bold;
            margin-top: 10px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .quantity button {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        .remove {
            color: #a33;
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
        }

        .summary {
            background: white;
            padding: 25px;
            height: fit-content;
        }

        .summary h2 {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
            font-size: 15px;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            font-weight: bold;
            font-size: 19px;
        }

        .checkout {
            width: 100%;
            padding: 15px;
            background: #1A1A1A;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .continue {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1A1A1A;
        }

        .empty {
            background: white;
            padding: 60px 20px;
            text-align: center;
        }

        .empty p {
            margin: 15px 0 25px;
            color: #666;
        }

        .empty a {
            display: inline-block;
            background: #1A1A1A;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
        }

        @media (max-width: 750px) {
            .bag-layout {
                grid-template-columns: 1fr;
            }

            .bag-item {
                align-items: flex-start;
            }

            .bag-item img {
                width: 95px;
                height: 120px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">VELORA</div>
    <a href="index.html">CONTINUE SHOPPING</a>
</header>

<main class="container">
    <h1>YOUR SHOPPING BAG</h1>

    <div id="bagContent"></div>
</main>

<script>
    let bag = JSON.parse(localStorage.getItem("veloraBag")) || [];

    function saveBag() {
        localStorage.setItem("veloraBag", JSON.stringify(bag));
    }

    function renderBag() {
        const bagContent = document.getElementById("bagContent");

        if (bag.length === 0) {
            bagContent.innerHTML = `
                <div class="empty">
                    <h2>Your bag is empty</h2>
                    <p>Discover your next favorite look.</p>
                    <a href="index.html">START SHOPPING</a>
                </div>
            `;
            return;
        }

        let subtotal = 0;

        bag.forEach(item => {
            subtotal += Number(item.price) * Number(item.quantity);
        });

        bagContent.innerHTML = `
            <div class="bag-layout">

                <div class="items">
                    ${bag.map((item, index) => `
                        <div class="bag-item">

                            <img src="${item.image}" alt="${item.name}">

                            <div class="item-info">
                                <h3>${item.name}</h3>

                                <p>${item.category || ""} ${item.type || ""}</p>

                                <p>Size: ${item.size || "N/A"}</p>
                                <p>Color: ${item.color || "N/A"}</p>

                                <div class="item-price">
                                    EGP ${Number(item.price).toLocaleString("en-EG")}
                                </div>

                                <div class="quantity">
                                    <button onclick="changeQuantity(${index}, -1)">−</button>
                                    <span>${item.quantity}</span>
                                    <button onclick="changeQuantity(${index}, 1)">+</button>
                                </div>

                                <button class="remove" onclick="removeItem(${index})">
                                    Remove
                                </button>
                            </div>

                        </div>
                    `).join("")}
                </div>

                <div class="summary">
                    <h2>ORDER SUMMARY</h2>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>EGP ${subtotal.toLocaleString("en-EG")}</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Calculated later</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total</span>
                        <span>EGP ${subtotal.toLocaleString("en-EG")}</span>
                    </div>

                    <button class="checkout" onclick="checkoutMessage()">
                        PROCEED TO CHECKOUT
                    </button>

                    <a class="continue" href="products.html">
                        Continue Shopping
                    </a>
                </div>

            </div>
        `;
    }

    function changeQuantity(index, amount) {
        bag[index].quantity = Number(bag[index].quantity) + amount;

        if (bag[index].quantity < 1) {
            bag[index].quantity = 1;
        }

        saveBag();
        renderBag();
    }

    function removeItem(index) {
        bag.splice(index, 1);
        saveBag();
        renderBag();
    }

    function checkoutMessage() {
        alert("Checkout is not available yet. This is a demo store.");
    }

    renderBag();
</script>

</body>
</html>
